services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: klyro
      POSTGRES_PASSWORD: klyro_dev_pw
      POSTGRES_DB: klyrostream
    ports:
      # host 5433 -> container 5432: a native Windows postgres service owns host 5432
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes: 
  postgres_data:
  redis_data: