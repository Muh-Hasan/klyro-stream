name: klyro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klyro
      POSTGRES_PASSWORD: klyro_dev
      POSTGRES_DB: klyro
    ports: ['5433:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klyro -d klyro']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes'] 
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: klyro
      RUSTFS_SECRET_KEY: klyro_dev_storage
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [rustfs_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      target: worker
    profiles: [worker]
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      FAIL_RATE: '0'
      DATABASE_URL: postgresql://klyro:klyro_dev@postgres:5432/klyro
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
