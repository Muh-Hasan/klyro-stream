services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: klyrostream_user
      POSTGRES_PASSWORD: klyrostream_pwd
      POSTGRES_DB: klyrostream
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes: 
  postgres_data:
  redis_data: